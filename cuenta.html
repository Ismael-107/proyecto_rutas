<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="./js/main.js"></script>
  <script type="module" src="./js/registro.js"></script>
</head>
<body>
  <header>
    <nav class="cabecera">
      <a href="index.html">
        <img src="img/Logotipo.png" alt="Logotipo de la aplicación">
      </a>
      <a href="cuenta.html" hidden>
        <img src="img/cuenta_inactiva.png" alt="Imagen de la cuenta">
      </a>
    </nav>
  </header>

  <main>
    <h1>Cuenta</h1>
    <h2 id="registro-titulo">Crear una cuenta</h2>

    <form id="registro" action="#" method="post" novalidate>
      <label for="usuario">Nombre de usuario:</label>
      <input type="text" id="usuario" name="usuario" required
             minlength="3" maxlength="20" autocomplete="username"
             aria-describedby="usuario-error">
      <p class="error" id="usuario-error"></p>

      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" required
             autocomplete="email" aria-describedby="email-error">
      <p class="error" id="email-error"></p>

      <fieldset id="registro-passwords">
        <legend>Contraseña</legend>
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required
               minlength="8" autocomplete="new-password"
               aria-describedby="password-ayuda password-error">
        <p id="password-ayuda">Mínimo 8 caracteres, una mayúscula y un número.</p>
        <p class="error" id="password-error"></p>

        <label for="confirmar">Repetir contraseña:</label>
        <input type="password" id="confirmar" name="confirmar" required
               autocomplete="new-password" aria-describedby="confirmar-error">
        <p class="error" id="confirmar-error"></p>
      </fieldset>

      <label for="fecha">Fecha de nacimiento:</label>
      <input type="date" id="fecha" name="fecha" min="1910-01-01" required
             aria-describedby="fecha-error">
      <p class="error" id="fecha-error"></p>

      <div>
        <input type="checkbox" id="terminos" name="terminos" required
               aria-describedby="terminos-error">
        <label for="terminos">Acepto los términos y condiciones</label>
      </div>
      <p class="error" id="terminos-error"></p>

      <button type="submit" id="registro-guardar">Crear cuenta</button>
      <button type="button" id="registro-cancelar" hidden>Cancelar edición</button>
      <p role="status" id="registro-aviso"></p>
    </form>

    <p>¿Ya tienes una cuenta? 
      <a href="index.html">Iniciar sesión</a>
    </p>

    <section id="usuarios">
      <h2>Usuarios</h2>
      <p id="usuarios-vacio">Todavía no hay usuarios.</p>
      <ul id="lista-usuarios"></ul>
    </section>
  </main>
</body>
</html>
