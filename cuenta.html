<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutas recientes</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <nav class="cabecera">
            <a href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/594/594846.png" alt="circulo azul"></a>
            <a href="cuenta.html" hidden><img src="https://cdn-icons-png.flaticon.com/512/594/594846.png" alt="circulo azul"></a>
        </nav>
    </header>
    <main>
        <h1>Cuenta</h1>
         <h1>Crear una cuenta</h1>

        <form action="#" method="post">

            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>

            <br><br>

            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" required>

            <br><br>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required>

            <br><br>

            <label for="usuario">Nombre de usuario:</label>
            <input type="text" id="usuario" name="usuario" required>

            <br><br>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required>

            <br><br>

            <label for="confirmar">Confirmar contraseña:</label>
            <input type="password" id="confirmar" name="confirmar" required>

            <br><br>

            <input type="checkbox" id="terminos" name="terminos" required>
            <label for="terminos">Acepto los términos y condiciones</label>
            
            <br><br>
            <button type="submit">Crear cuenta</button>

        </form>

        <p>¿Ya tienes una cuenta? 
            <a href="index.html">Iniciar sesión</a>
        </p>
    </main>
</body>
</html>
